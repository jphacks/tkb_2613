[project]
name = "tkb-data-prep"
version = "0.0.0"
description = "公開データ（郵便番号、メッシュ、駅、世帯数、市外局番）を表に変換する"
requires-python = ">=3.13,<3.14"
dependencies = [
  "jismesh>=2.1",
  "pyarrow>=18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tkb_data_prep"]
