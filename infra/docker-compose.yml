# 起動：make up（docker compose --env-file .env -f infra/docker-compose.yml up --build）
# VLM と OCR はチームのサーバーで動かすので、ここには含めない
#
# api の設定（MOCK_MODE、CORS_ORIGINS、COOKIE_SECURE など）は、リポジトリ直下の .env から読む。
# .env に書いていない項目は api の既定値（モック、CORS は http://localhost:3000、Cookie の Secure なし）。
# AWS のアプリの EC2 で使う値は infra/aws.env.example を見る。

name: tkb_2613

# コンテナの標準出力の記録に上限を付ける（既定は上限なしでディスクに残り続けるため）
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    env_file:
      - path: ../.env
        required: false
      # AWS のアプリの EC2 だけ：起動スクリプト（infra/terraform）が Secrets Manager から読んだ
      # VLM のキーを、メモリ上（/run は tmpfs）に一時的に置く。後に書いたほうが優先されるので、
      # .env の空の VLM_API_KEY を上書きする。手元にはこのファイルがないので、何も変わらない
      - path: /run/tkb_2613/api-secrets.env
        required: false
    logging: *logging
    # api はホストの外に出さない（web だけが compose のネットワークの中で呼ぶ）
    ports:
      - "127.0.0.1:8001:8001"
    # 推理の表（make data で作る）。読み取り専用でつなぐ。なければ最寄り駅のルールだけを飛ばす
    volumes:
      - ../data/processed:/app/data/processed:ro
      - shared-results:/app/data/private
    # 写真をディスクに残さないよう、ファイルシステムを読み取り専用にする
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ../web
      args:
        # 画面の /api を、同じネットワークの api コンテナに中継する
        API_ORIGIN: http://api:8001
    env_file:
      - path: ../.env
        required: false
      - path: /run/tkb_2613/web-secrets.env
        required: false
    environment:
      API_INTERNAL_ORIGIN: http://api:8001
    # 既定は 127.0.0.1 だけに公開する。AWS のアプリの EC2 では WEB_BIND=0.0.0.0 にして、
    # CloudFront の VPC origin から届くようにする（届く先はセキュリティグループで絞る）
    ports:
      - "${WEB_BIND:-127.0.0.1}:3000:3000"
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1000,gid=1000
    logging: *logging
    depends_on:
      api:
        condition: service_healthy

volumes:
  shared-results:
