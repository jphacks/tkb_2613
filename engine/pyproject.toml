[project]
name = "tkb-engine"
version = "0.0.0"
description = "手がかりからの推理ルール、最小削除プランナー、再診断"
requires-python = ">=3.13,<3.14"
dependencies = [
  "pyarrow>=18.0",
  "tkb-common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tkb_engine"]

[tool.uv.sources]
tkb-common = { workspace = true }
