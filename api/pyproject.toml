[project]
name = "tkb-api"
version = "0.0.0"
description = "受付 API（FastAPI）"
requires-python = ">=3.13,<3.14"
dependencies = [
  "atproto>=0.0.73",
  "fastapi>=0.115",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tkb_api"]
