<svg xmlns="http://www.w3.org/2000/svg" width="520" height="940" viewBox="0 0 520 940" role="img" aria-labelledby="title desc">
  <title id="title">みーつけたの技術構成</title>
  <desc id="desc">Next.jsの画面とFastAPIが連携し、APIが本人のBluesky投稿を取得する。写真と本文はチーム管理のVLM、写真は接続設定時にOCRも使う。main実装のR1からR12の推理仕様と、末尾3件の結論から対象属性を選んで最大3件を選ぶplan、simulateを示す。APIが結果をSSEで画面へ配信し、削除は画面での確認後に別リクエストで行う。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#f15b55" /></marker>
    <marker id="arrowStart" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8 Z" fill="#f15b55" /></marker>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .title { fill:#f4f6fb; font-size:24px; font-weight:750; }
      .sub { fill:#bac5da; font-size:14px; }
      .head { fill:#f4f6fb; font-size:17px; font-weight:700; }
      .body { fill:#e5eaf4; font-size:14px; }
      .small { fill:#c7d1e3; font-size:12.5px; }
      .card { fill:#1d2944; stroke:#465472; stroke-width:1.5; }
      .team { fill:#22283f; stroke:#f15b55; stroke-width:1.5; }
      .line { fill:none; stroke:#f15b55; stroke-width:2.2; marker-end:url(#arrow); }
      .both { fill:none; stroke:#f15b55; stroke-width:2.2; marker-start:url(#arrowStart); marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="520" height="940" rx="18" fill="#11182b" />
  <text class="title" x="24" y="40">技術構成とデータの流れ</text>
  <text class="sub" x="24" y="65">本人投稿から推理・操作までのデータの流れ</text>

  <rect class="card" x="24" y="88" width="210" height="92" rx="12" />
  <text class="head" x="42" y="119">Web</text><text class="body" x="42" y="143">Next.js / TypeScript</text><text class="small" x="42" y="165">本人操作・結果表示</text>
  <rect class="card" x="286" y="88" width="210" height="92" rx="12" />
  <text class="head" x="304" y="119">API</text><text class="body" x="304" y="143">FastAPI / Python</text><text class="small" x="304" y="165">セッション・処理の仲介</text>
  <path class="both" d="M242 126 H278" /><text class="small" x="260" y="111" text-anchor="middle">HTTP / SSE</text>

  <rect class="team" x="24" y="230" width="210" height="106" rx="12" />
  <text class="head" x="42" y="261">Bluesky</text><text class="body" x="42" y="285">セッション本人の投稿</text><text class="small" x="42" y="307">本人DIDにひもづけて取得</text><text class="small" x="42" y="326">写真: cdn.bsky.app</text>
  <rect class="team" x="286" y="230" width="210" height="106" rx="12" />
  <text class="head" x="304" y="261">detect / チームサーバー</text><text class="body" x="304" y="285">VLM: vLLM互換API</text><text class="body" x="304" y="308">OCR: PP-OCRv5（任意接続）</text><text class="small" x="304" y="328">観測Clueを抽出</text>
  <path class="both" d="M286 157 C264 174 248 199 222 225" />
  <path class="both" d="M391 182 V225" />

  <rect class="card" x="24" y="390" width="472" height="132" rx="12" />
  <text class="head" x="44" y="422">engine（main仕様の説明）</text><text class="body" x="44" y="449">R1–R12 → 根拠付きConclusion</text><text class="body" x="44" y="472">plan: 末尾3結論から対象属性を選び最大3投稿</text>
  <text class="small" x="44" y="499">simulateは仮除外で再推理。16項目目標は未接続。</text>
  <path class="line" d="M391 337 V382" />

  <rect class="card" x="24" y="566" width="472" height="106" rx="12" />
  <text class="head" x="44" y="598">診断結果をSSEで配信</text><text class="body" x="44" y="627">post → clues → conclusions → plan → done</text>
  <text class="small" x="44" y="653">Clueは観測、Conclusionは推理。clue_indicesで根拠へ戻る。</text>
  <path class="line" d="M260 523 V558" />

  <rect class="team" x="24" y="706" width="472" height="132" rx="12" />
  <text class="head" x="44" y="739">本人の確認後に削除</text>
  <text class="body" x="44" y="768">選択・確認後、別の POST /api/delete を実行</text>
  <text class="body" x="44" y="792">本人投稿だけを削除。元に戻せない。</text>
  <text class="small" x="44" y="818">仮比較は POST /api/simulate。SSE受信で削除されない。</text>

  <rect class="card" x="24" y="860" width="472" height="68" rx="12" />
  <text class="small" x="42" y="887">画面表示の画像読込みは、APIが画像をモデルへ送る処理とは別。</text>
  <text class="small" x="42" y="909">どちらもBluesky CDNを利用し、本人投稿画像を扱う。</text>
</svg>
