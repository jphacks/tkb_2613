<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">みーつけた：その投稿、組み合わせると、どこまで分かる？</title>
  <desc id="d">1件ずつは何気ない4つの投稿が赤い糸でつながり、住んでいる町まで絞り込まれる様子。</desc>
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#10204d"/></pattern>
    <pattern id="g5" width="120" height="120" patternUnits="userSpaceOnUse"><path d="M120 0H0V120" fill="none" stroke="#152a5e"/></pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ef2b36" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ef2b36" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <style>
      .jp{font-family:"Noto Sans JP","Noto Sans CJK JP","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif}
      .mono{font-family:"JetBrains Mono","SFMono-Regular",Menlo,Consolas,"DejaVu Sans Mono",monospace}
      .post{fill:#0e1f4f;stroke:#8fa6d8;stroke-width:1.2}
      .ptxt{font-size:19px;fill:#eef2fc}
      .pmeta{font-size:13px;fill:#8fa6d8}
      .clue{font-size:13px;font-weight:700;fill:#ffd2d4}
    </style>
  </defs>

  <rect width="1280" height="640" fill="#071233"/>
  <rect width="1280" height="640" fill="url(#g)"/>
  <rect width="1280" height="640" fill="url(#g5)"/>

  <!-- 左：題字 -->
  <text x="72" y="112" class="mono" style="font-size:15px;letter-spacing:3px;fill:#ef2b36">JPHACKS 2026  TKB_2613</text>
  <text x="68" y="214" class="jp" style="font-size:92px;font-weight:900;fill:#eef2fc;letter-spacing:2px">みーつけた</text>
  <text x="72" y="290" class="jp" style="font-size:31px;font-weight:700;fill:#eef2fc">その投稿、組み合わせると、</text>
  <text x="72" y="334" class="jp" style="font-size:31px;font-weight:700;fill:#eef2fc">どこまで分かる？</text>
  <rect x="72" y="364" width="64" height="5" fill="#ef2b36"/>
  <text x="72" y="410" class="jp" style="font-size:18px;fill:#9fb0d6">自分の SNS 投稿を横断して、何が推定されるかを確かめ、</text>
  <text x="72" y="438" class="jp" style="font-size:18px;fill:#9fb0d6">消すべき投稿だけを選べる、自己診断ツール。</text>
  <g class="mono" style="font-size:14px;fill:#c9d4ee">
    <rect x="72" y="486" width="98" height="32" rx="16" fill="none" stroke="#4a66a8"/><text x="91" y="507">Bluesky</text>
    <rect x="182" y="486" width="98" height="32" rx="16" fill="none" stroke="#4a66a8"/><text x="200" y="507">Threads</text>
    <rect x="292" y="486" width="58" height="32" rx="16" fill="none" stroke="#4a66a8"/><text x="316" y="507">X</text>
  </g>

  <!-- 右：捜査ボード -->
  <circle cx="944" cy="352" r="150" fill="url(#glow)"/>

  <g fill="none" stroke="#ef2b36" stroke-width="2.2" stroke-linecap="round">
    <path d="M776 150 Q860 230 944 352"/>
    <path d="M1150 168 Q1040 240 944 352"/>
    <path d="M770 548 Q850 450 944 352"/>
    <path d="M1160 540 Q1050 460 944 352"/>
  </g>

  <!-- 投稿カード（どれも架空） -->
  <g class="jp" filter="url(#sh)">
    <rect x="612" y="92" width="290" height="100" rx="10" class="post" transform="rotate(-3 757 142)"/>
    <rect x="1000" y="104" width="250" height="100" rx="10" class="post" transform="rotate(2.5 1125 154)"/>
    <rect x="606" y="494" width="300" height="100" rx="10" class="post" transform="rotate(2 756 544)"/>
    <rect x="1010" y="488" width="242" height="100" rx="10" class="post" transform="rotate(-2.5 1131 538)"/>
  </g>
  <g class="jp">
    <g transform="rotate(-3 757 142)">
      <text x="632" y="132" class="ptxt">燃えるゴミ、また出し忘れた</text>
      <text x="632" y="170" class="pmeta">月曜 7:50</text>
      <text x="760" y="170" class="clue">→ 収集日</text>
    </g>
    <g transform="rotate(2.5 1125 154)">
      <text x="1020" y="144" class="ptxt">家の前のバス停、</text>
      <text x="1020" y="170" class="ptxt">今日も遅れてる</text>
      <text x="1146" y="194" class="clue">→ バス停</text>
    </g>
    <g transform="rotate(2 756 544)">
      <text x="626" y="534" class="ptxt">娘の小学校のお祭り、</text>
      <text x="626" y="560" class="ptxt">輪投げ係になった</text>
      <text x="800" y="584" class="clue">→ 学区</text>
    </g>
    <g transform="rotate(-2.5 1131 538)">
      <text x="1030" y="528" class="ptxt">近所の公園が</text>
      <text x="1030" y="554" class="ptxt">避難所だった</text>
      <text x="1150" y="578" class="clue">→ 避難所</text>
    </g>
  </g>

  <!-- ピンと答え -->
  <g filter="url(#sh)">
    <rect x="828" y="300" width="232" height="104" rx="10" fill="#ef2b36"/>
  </g>
  <text x="944" y="340" text-anchor="middle" class="jp" style="font-size:16px;font-weight:700;fill:#071233">4件を重ねると</text>
  <text x="944" y="384" text-anchor="middle" class="jp" style="font-size:32px;font-weight:900;fill:#ffffff">町まで絞れる</text>
  <circle cx="944" cy="300" r="9" fill="#ffd2d4" stroke="#071233" stroke-width="3"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
