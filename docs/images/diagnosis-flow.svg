<svg xmlns="http://www.w3.org/2000/svg" width="420" height="1270" viewBox="0 0 420 1270" role="img" aria-labelledby="title desc">
  <title id="title">みーつけたの診断体験</title>
  <desc id="desc">本人ログインから本人投稿の取得、OCRとVLMによる手がかり抽出、main実装のR1からR12の推理、結論リスト末尾3件から選んだ属性を対象とする最大3件の候補、仮除外、利用者確認後の実削除、再診断までを示す。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#f15b55" /></marker>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .title { fill:#f4f6fb; font-size:24px; font-weight:750; }
      .sub { fill:#bac5da; font-size:14px; }
      .head { fill:#f4f6fb; font-size:18px; font-weight:700; }
      .body { fill:#e5eaf4; font-size:14px; }
      .small { fill:#c7d1e3; font-size:13px; }
      .chip { fill:#f4f6fb; font-size:12px; font-weight:700; }
      .card { fill:#1d2944; stroke:#465472; stroke-width:1.5; }
      .danger { fill:#2b202f; stroke:#f15b55; stroke-width:1.5; }
      .line { fill:none; stroke:#f15b55; stroke-width:2.5; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="420" height="1270" rx="18" fill="#11182b" />
  <text class="title" x="24" y="40">投稿を見直す体験</text>
  <text class="sub" x="24" y="66">本人アカウントの投稿を診断する実モード</text>

  <rect class="card" x="24" y="94" width="372" height="100" rx="12" />
  <circle cx="51" cy="124" r="16" fill="#f15b55" /><text class="chip" x="51" y="128" text-anchor="middle">1</text>
  <text class="head" x="78" y="129">本人ログイン</text>
  <text class="body" x="44" y="159">Bluesky のアプリパスワードで認証</text>
  <text class="small" x="44" y="181">診断対象はセッションの本人DIDに限定</text>
  <path class="line" d="M210 195 V216" />

  <rect class="card" x="24" y="226" width="372" height="100" rx="12" />
  <circle cx="51" cy="256" r="16" fill="#f15b55" /><text class="chip" x="51" y="260" text-anchor="middle">2</text>
  <text class="head" x="78" y="261">本人の投稿を取得</text>
  <text class="body" x="44" y="291">Bluesky から直近の投稿を読み込む</text>
  <text class="small" x="44" y="313">投稿の写真は cdn.bsky.app から取得</text>
  <path class="line" d="M210 327 V348" />

  <rect class="card" x="24" y="358" width="372" height="110" rx="12" />
  <circle cx="51" cy="388" r="16" fill="#f15b55" /><text class="chip" x="51" y="392" text-anchor="middle">3</text>
  <text class="head" x="78" y="393">投稿ごとに手がかりを抽出</text>
  <text class="body" x="44" y="423">本文・写真をチーム管理のVLMへ</text>
  <text class="body" x="44" y="446">写真はOCRも利用（接続設定時）</text>
  <path class="line" d="M210 469 V490" />

  <rect class="card" x="24" y="500" width="372" height="116" rx="12" />
  <circle cx="51" cy="530" r="16" fill="#f15b55" /><text class="chip" x="51" y="534" text-anchor="middle">4</text>
  <text class="head" x="78" y="535">根拠付きの試作推理</text>
  <text class="body" x="44" y="565">mainのR1–R12が手がかりから結論を作る</text>
  <text class="body" x="44" y="588">各結論から使った手がかりをたどる</text>
  <text class="small" x="44" y="608">16項目プロフィールは目標段階</text>
  <path class="line" d="M210 617 V638" />

  <rect class="card" x="24" y="648" width="372" height="112" rx="12" />
  <circle cx="51" cy="678" r="16" fill="#f15b55" /><text class="chip" x="51" y="682" text-anchor="middle">5</text>
  <text class="head" x="78" y="683">削除候補を最大3件まで提示</text>
  <text class="body" x="44" y="713">生成済み結論の末尾3件から属性を選ぶ</text>
  <text class="small" x="44" y="738">貪欲に最大3投稿を選ぶ / 16項目は未接続</text>
  <path class="line" d="M210 761 V782" />

  <rect class="card" x="24" y="792" width="372" height="106" rx="12" />
  <circle cx="51" cy="822" r="16" fill="#f15b55" /><text class="chip" x="51" y="826" text-anchor="middle">6</text>
  <text class="head" x="78" y="827">仮除外して比較</text>
  <text class="body" x="44" y="857">選んだ投稿を除いて同じルールを再実行</text>
  <text class="small" x="44" y="881">この段階では投稿を削除しない</text>
  <path class="line" d="M210 899 V920" />

  <rect class="danger" x="24" y="930" width="372" height="120" rx="12" />
  <circle cx="51" cy="960" r="16" fill="#f15b55" /><text class="chip" x="51" y="964" text-anchor="middle">7</text>
  <text class="head" x="78" y="965">本人が選択・確認して削除</text>
  <text class="body" x="44" y="995">確認後、別の POST /api/delete を実行</text>
  <text class="body" x="44" y="1018">実アカウントの投稿は元に戻せない</text>
  <text class="small" x="44" y="1040">削除を試す場合は専用アカウントを使用</text>
  <path class="line" d="M210 1051 V1072" />

  <rect class="card" x="24" y="1082" width="372" height="118" rx="12" />
  <circle cx="51" cy="1112" r="16" fill="#f15b55" /><text class="chip" x="51" y="1116" text-anchor="middle">8</text>
  <text class="head" x="78" y="1117">残った投稿で再診断</text>
  <text class="body" x="44" y="1147">Blueskyから現在の本人投稿を再取得</text>
  <text class="small" x="44" y="1172">削除後の結論と根拠を確認する</text>
</svg>
