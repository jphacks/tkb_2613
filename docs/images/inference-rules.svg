<svg xmlns="http://www.w3.org/2000/svg" width="900" height="2290" viewBox="0 0 900 2290" role="img" aria-labelledby="title desc">
  <title id="title">みーつけた main の推理ルール R1〜R12</title>
  <desc id="desc">投稿写真と本文からdetectがClueを抽出し、engineがClue、必要な投稿本文や時刻、知識表を使って12ルールを適用し、根拠番号付きConclusionを作る構造図。R4からR5、条件付きでR1とR7、R1からR2とR11への依存をノードと矢印で示す。planは結論リスト末尾3件から対象属性を選び、最大3投稿を貪欲に選ぶ。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#f15b55" /></marker>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .title { fill:#f4f6fb; font-size:32px; font-weight:750; }
      .sub { fill:#bac5da; font-size:19px; }
      .head { fill:#f4f6fb; font-size:23px; font-weight:700; }
      .body { fill:#e5eaf4; font-size:20px; }
      .small { fill:#c7d1e3; font-size:17px; }
      .chip { fill:#f4f6fb; font-size:19px; font-weight:750; }
      .panel { fill:#18233b; stroke:#465472; stroke-width:2; }
      .card { fill:#1d2944; stroke:#465472; stroke-width:1.7; }
      .source { fill:#22283f; stroke:#f15b55; stroke-width:2; }
      .node { fill:#26334f; stroke:#f15b55; stroke-width:1.8; }
      .nodeText { fill:#f4f6fb; font-size:18px; font-weight:700; }
      .edgeLabel { fill:#f4f6fb; font-size:15px; font-weight:650; }
      .accent { fill:#f15b55; }
      .link { fill:none; stroke:#f15b55; stroke-width:3; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="900" height="2290" rx="20" fill="#11182b" />
  <text class="title" x="42" y="55">投稿の断片を結論へつなぐ</text>
  <text class="sub" x="42" y="88">main実装のR1〜R12を、入力から出力まで整理</text>

  <rect class="source" x="42" y="120" width="816" height="126" rx="14" />
  <text class="head" x="66" y="158">写真・本文から観測を抽出し、推理へ渡す</text>
  <text class="body" x="66" y="192">写真・本文 → detect（VLM/OCR）→ Clue（観測）</text>
  <text class="body" x="66" y="222">engine入力: Clue[] ＋ 必要なPost本文/時刻 ＋ Gazetteer</text>
  <path class="link" d="M450 249 V276" />

  <text class="head" x="42" y="313">地域・場所・移動</text>
  <rect class="card" x="42" y="332" width="816" height="103" rx="12" />
  <circle class="accent" cx="76" cy="368" r="20" /><text class="chip" x="76" y="375" text-anchor="middle">R1</text>
  <text class="head" x="112" y="370">生活圏・最寄り駅</text>
  <text class="body" x="112" y="405">駅名の票を住所/郵便番号や市区町村で絞る。住所から町名も推定。</text>

  <rect class="card" x="42" y="446" width="816" height="103" rx="12" />
  <circle class="accent" cx="76" cy="482" r="20" /><text class="chip" x="76" y="489" text-anchor="middle">R2</text>
  <text class="head" x="112" y="484">平日の行動時間</text>
  <text class="body" x="112" y="519">R1の駅周辺・平日の投稿時刻。3日以上に分散し、場所投稿が2件以上。</text>

  <rect class="card" x="42" y="560" width="816" height="103" rx="12" />
  <circle class="accent" cx="76" cy="596" r="20" /><text class="chip" x="76" y="603" text-anchor="middle">R4</text>
  <text class="head" x="112" y="598">市区町村</text>
  <text class="body" x="112" y="633">指定ごみ袋の容量/価格、市区町村名、駅との距離から候補を絞る。</text>

  <rect class="card" x="42" y="674" width="816" height="103" rx="12" />
  <circle class="accent" cx="76" cy="710" r="20" /><text class="chip" x="76" y="717" text-anchor="middle">R5</text>
  <text class="head" x="112" y="712">ごみ収集地区</text>
  <text class="body" x="112" y="747">R4の市区町村、燃やすごみの曜日、住所の町名で地区を絞る。</text>

  <rect class="card" x="42" y="788" width="816" height="103" rx="12" />
  <circle class="accent" cx="76" cy="824" r="20" /><text class="chip" x="76" y="831" text-anchor="middle">R6</text>
  <text class="head" x="112" y="826">住所の区画</text>
  <text class="body" x="112" y="861">住所表示や郵便物バーコードから郵便番号・町名・番地を照合。</text>

  <rect class="card" x="42" y="902" width="816" height="103" rx="12" />
  <circle class="accent" cx="76" cy="938" r="20" /><text class="chip" x="76" y="945" text-anchor="middle">R11</text>
  <text class="head" x="112" y="940">利用路線</text>
  <text class="body" x="112" y="975">R1駅との路線一致、または同じ路線名が複数投稿にあるかを確認。</text>

  <text class="head" x="42" y="1060">生活のパターン・属性の手がかり</text>
  <rect class="card" x="42" y="1079" width="816" height="103" rx="12" />
  <circle class="accent" cx="76" cy="1115" r="20" /><text class="chip" x="76" y="1122" text-anchor="middle">R3</text>
  <text class="head" x="112" y="1117">定期的な外出</text>
  <text class="small" x="112" y="1152">投稿日が3日以上に分散した場合、同じ曜/時間帯に3件以上。</text>
  <text class="small" x="112" y="1174">曜日付きroutine_textは、時刻条件なしで使う。</text>

  <rect class="card" x="42" y="1193" width="816" height="103" rx="12" />
  <circle class="accent" cx="76" cy="1229" r="20" /><text class="chip" x="76" y="1236" text-anchor="middle">R7</text>
  <text class="head" x="112" y="1231">学校</text>
  <text class="body" x="112" y="1266">学校名、または市区町村と大学の時限/時間割から候補を絞る。</text>

  <rect class="card" x="42" y="1307" width="816" height="103" rx="12" />
  <circle class="accent" cx="76" cy="1343" r="20" /><text class="chip" x="76" y="1350" text-anchor="middle">R8</text>
  <text class="head" x="112" y="1345">名前</text>
  <text class="body" x="112" y="1380">名札/宛名の姓と呼びかけの名を照合し、手がかりをまとめる。</text>

  <rect class="card" x="42" y="1421" width="816" height="103" rx="12" />
  <circle class="accent" cx="76" cy="1457" r="20" /><text class="chip" x="76" y="1464" text-anchor="middle">R9</text>
  <text class="head" x="112" y="1459">年齢</text>
  <text class="body" x="112" y="1494">本文の年齢、誕生日と飲酒解禁、成人式の準備を手がかりにする。</text>

  <rect class="card" x="42" y="1535" width="816" height="103" rx="12" />
  <circle class="accent" cx="76" cy="1571" r="20" /><text class="chip" x="76" y="1578" text-anchor="middle">R10</text>
  <text class="head" x="112" y="1573">仕事の種類</text>
  <text class="body" x="112" y="1608">シフト語や制服/作業着を使う。制服の手がかり1件だけでは決めない。</text>

  <rect class="card" x="42" y="1649" width="816" height="103" rx="12" />
  <circle class="accent" cx="76" cy="1685" r="20" /><text class="chip" x="76" y="1692" text-anchor="middle">R12</text>
  <text class="head" x="112" y="1687">生年月日</text>
  <text class="body" x="112" y="1722">本文の日付を優先し、条件を満たす場合は誕生日の投稿日も使う。</text>

  <rect class="panel" x="42" y="1780" width="816" height="270" rx="14" />
  <text class="head" x="66" y="1820">規則間の依存（線は条件が合うときの受け渡し）</text>
  <rect class="node" x="70" y="1850" width="150" height="54" rx="10" /><text class="nodeText" x="145" y="1884" text-anchor="middle">R4 市区町村</text>
  <rect class="node" x="310" y="1850" width="150" height="54" rx="10" /><text class="nodeText" x="385" y="1884" text-anchor="middle">R1 生活圏</text>
  <rect class="node" x="630" y="1830" width="190" height="54" rx="10" /><text class="nodeText" x="725" y="1864" text-anchor="middle">R2 行動時間</text>
  <rect class="node" x="630" y="1930" width="190" height="54" rx="10" /><text class="nodeText" x="725" y="1964" text-anchor="middle">R11 路線</text>
  <rect class="node" x="70" y="1945" width="150" height="54" rx="10" /><text class="nodeText" x="145" y="1979" text-anchor="middle">R5 収集地区</text>
  <rect class="node" x="310" y="1945" width="150" height="54" rx="10" /><text class="nodeText" x="385" y="1979" text-anchor="middle">R7 学校</text>
  <path class="link" d="M220 1877 H300" /><text class="edgeLabel" x="260" y="1869" text-anchor="middle">住所なし</text>
  <path class="link" d="M145 1904 V1935" />
  <path class="link" d="M220 1890 V1922 H300 V1945" /><text class="edgeLabel" x="260" y="1916" text-anchor="middle">時間割</text>
  <path class="link" d="M460 1877 H610 V1857 H620" /><text class="edgeLabel" x="545" y="1867" text-anchor="middle">平日/時刻</text>
  <path class="link" d="M460 1893 H610 V1957 H620" /><text class="edgeLabel" x="545" y="1926" text-anchor="middle">駅路線一致</text>
  <text class="small" x="70" y="2032">R11は駅が合わない場合、別の条件（複数投稿の路線名）でも結論を作る。</text>

  <path class="link" d="M450 2052 V2070" />
  <rect class="source" x="42" y="2078" width="816" height="166" rx="14" />
  <text class="head" x="66" y="2100">出力と仮除外</text>
  <text class="body" x="66" y="2135">Conclusion = 項目・値・推理メモ・根拠の clue_indices</text>
  <text class="body" x="66" y="2168">simulateは投稿を仮除外して再推理。planは末尾3結論から対象属性を選び</text>
  <text class="body" x="66" y="2197">貪欲に最大3投稿を選ぶ。全属性の最小解を探す処理ではない。</text>
  <text class="small" x="66" y="2229">各ルールの条件を満たした場合だけ、対応する結論を返す。</text>
  <text class="small" x="42" y="2264">参照元: main の engine/src/tkb_engine/rules.py・planner.py。条件を整理した図。</text>
</svg>
