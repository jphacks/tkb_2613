[project]
name = "tkb-detect"
version = "0.0.0"
description = "OCR と画像を読む言語モデルの呼び出し"
requires-python = ">=3.13,<3.14"
dependencies = [
  "httpx>=0.28",
  "pillow>=13.0.0",
  "tkb-common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tkb_detect"]

[tool.uv.sources]
tkb-common = { workspace = true }
